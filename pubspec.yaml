name: zeely_test
description: Test project for Zeely.

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.2
  flutter_i18n: ^0.36.3
  get: ^4.7.3

dev_dependencies:
  flutter_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/flutter_i18n/en/
    - assets/images/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  fonts:
    - family: Italian Plate No2 Expanded
      fonts:
        - asset: assets/fonts/Italian Plate No2 Expanded/Italian Plate No2 Expanded.ttf
        - asset: assets/fonts/Italian Plate No2 Expanded/Italian Plate No2 Expanded Black.ttf
        - asset: assets/fonts/Italian Plate No2 Expanded/Italian Plate No2 Expanded Black Italic.ttf
        - asset: assets/fonts/Italian Plate No2 Expanded/Italian Plate No2 Expanded Bold.ttf
        - asset: assets/fonts/Italian Plate No2 Expanded/Italian Plate No2 Expanded Bold Italic.ttf
        - asset: assets/fonts/Italian Plate No2 Expanded/Italian Plate No2 Expanded Demibold.ttf
        - asset: assets/fonts/Italian Plate No2 Expanded/Italian Plate No2 Expanded Demibold Italic.ttf
        - asset: assets/fonts/Italian Plate No2 Expanded/Italian Plate No2 Expanded Extrabold.ttf
        - asset: assets/fonts/Italian Plate No2 Expanded/Italian Plate No2 Expanded Extrabold Italic.ttf
        - asset: assets/fonts/Italian Plate No2 Expanded/Italian Plate No2 Expanded Extralight.ttf
        - asset: assets/fonts/Italian Plate No2 Expanded/Italian Plate No2 Expanded Extralight Italic.ttf
        - asset: assets/fonts/Italian Plate No2 Expanded/Italian Plate No2 Expanded Italic.ttf
        - asset: assets/fonts/Italian Plate No2 Expanded/Italian Plate No2 Expanded Light.ttf
        - asset: assets/fonts/Italian Plate No2 Expanded/Italian Plate No2 Expanded Light Italic.ttf
        - asset: assets/fonts/Italian Plate No2 Expanded/Italian Plate No2 Expanded Medium.ttf
        - asset: assets/fonts/Italian Plate No2 Expanded/Italian Plate No2 Expanded Medium Italic.ttf
        - asset: assets/fonts/Italian Plate No2 Expanded/Italian Plate No2 Expanded Thin.ttf
        - asset: assets/fonts/Italian Plate No2 Expanded/Italian Plate No2 Expanded Thin Italic.ttf
        - asset: assets/fonts/Italian Plate No2 Expanded/Italian Plate No2 Expanded Ultralight.ttf
        - asset: assets/fonts/Italian Plate No2 Expanded/Italian Plate No2 Expanded Ultralight Italic.ttf
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
